<!DOCTYPE html>

<title>Back Soon — NewSociety</title>
<link rel="icon" href="/icons/icon-192.png">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<!-- Shown by the service worker (sw.js) only to returning visitors, when a
     page they haven't opened before can't be loaded: no connection, or the
     server answering with an error (as during the Nov 19 credits outage). -->
<main id="main">
<section class="page-hero not-found">
  <div class="wrap">
    <div class="eyebrow"><span class="live-dot"></span>Back soon</div>
    <h1 class="page-title display">We’ll be right back.</h1>
    <p class="page-sub">NewSociety can’t load this page right now. Pages you’ve opened before still work, and your saved stories live on this device.</p>
    <div class="cta-actions" style="justify-content:flex-start; margin-top:36px;">
      <a href="/" class="btn btn-primary">Home →</a>
      <a href="/saved.html" class="btn btn-ghost">Your saved stories</a>
    </div>
  </div>
</section>
</main>
</body>
</html>
