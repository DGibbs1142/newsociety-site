[build]
  publish = "."

[functions]
  directory = "netlify/functions"

# config.local.js holds real API secrets and must never be publicly
# fetchable. It's gitignored, but the deploy tooling bundles the raw
# working directory regardless — this redirect blocks the path at
# Netlify's edge routing layer as a backstop that doesn't depend on the
# file actually being absent from the deploy bundle.
[[redirects]]
  from = "/config.local.js"
  to = "/"
  status = 404
  force = true

# Same backstop as config.local.js above, for everything else the raw
# working directory drags along: the git history, local editor/CLI state,
# and the deploy config itself. None of it is part of the site, and a
# served .git directory in particular hands out the whole repo. Blocking
# at the edge doesn't depend on these files being absent from the bundle.
[[redirects]]
  from = "/.git/*"
  to = "/"
  status = 404
  force = true

[[redirects]]
  from = "/.claude/*"
  to = "/"
  status = 404
  force = true

[[redirects]]
  from = "/.gitignore"
  to = "/"
  status = 404
  force = true

[[redirects]]
  from = "/netlify.toml"
  to = "/"
  status = 404
  force = true

# Clean address for the link-in-bio page the social profiles point at.
[[redirects]]
  from = "/links"
  to = "/links.html"
  status = 200

# Baseline security headers. The site has no login and no cookies, so these
# are about protecting visitors from the page being framed, sniffed, or
# leaking full URLs to the APIs it calls.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    # No page carries inline script (the font swap and the detail page's
    # broken-image handler both moved into .js files), so script-src can stay
    # strict. Styles still need 'unsafe-inline' for the style="" attributes
    # sprinkled through the markup. Images come from a dozen third-party CDNs,
    # so img-src allows any https source rather than listing them all.
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; script-src 'self' https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://graphql.anilist.co https://site.api.espn.com https://site.web.api.espn.com https://itunes.apple.com https://www.googleapis.com https://cloudflareinsights.com; upgrade-insecure-requests"
